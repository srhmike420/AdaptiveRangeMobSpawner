# Adaptive Range Mob Spawner - Paper 26.2 build

# Range applied at plugin startup before TPS-based switching occurs.
initial-spawner-range: 80

# Range used when TPS is healthy.
spawner-range-high: 80

# Range used when TPS falls to/below tps-threshold-low.
spawner-range-low: 16

# Hysteresis avoids repeatedly flipping ranges around one TPS value.
tps-threshold-low: 18.5
tps-threshold-high: 19.5

# 20 ticks = 1 second. 200 ticks = 10 seconds.
update-interval-ticks: 200

# If true, naturally generated spawners also use the adaptive range.
affect-naturally-generated: false

# If true, existing unmarked spawners are treated as player-placed.
# WARNING: this can include naturally generated spawners that already existed.
update-preexisting-spawners: false

# Startup scan pacing.
chunks-per-tick: 5

# Detailed logging.
debug-mode: false

# Only scan loaded chunks around online players when the range changes.
only-update-near-players: true

# Circular radius in chunks around each player.
player-chunk-radius: 5

# Worlds where this plugin does nothing.
disabled-worlds: []
#  - world_nether
#  - world_the_end
